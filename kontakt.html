<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

          <style>
            body{
                background:#f5f7fa;
            }
    
            .login-box{
                max-width:450px;
                margin:80px auto;
                background:white;
                padding:35px;
                border-radius:16px;
                box-shadow:0 10px 30px rgba(0,0,0,.08);
            }
    
            .input-group-text{
                background:#0d6efd;
                color:white;
                border:none;
                width:50px;
                justify-content:center;
            }
    
            .form-floating > .form-control,
            .form-floating > .form-select{
                border-left:none;
            }
    
            .btn-login{
                padding:12px;
                font-weight:600;
            }
        </style>
</head>
<body>
    <div class="container">

        <div class="login-box">
    
            <h2 class="text-center mb-4">
                Přihlášení
            </h2>
    
            <form class="needs-validation" novalidate>
    
                <div class="input-group mb-3">
    
                    <span class="input-group-text">
                        <i class="fa-solid fa-user"></i>
                    </span>
    
                    <div class="form-floating">
                        <input type="text"
                               class="form-control"
                               id="username"
                               placeholder="Uživatelské jméno"
                               required>
    
                        <label for="username">
                            Uživatelské jméno
                        </label>
    
                        <div class="invalid-feedback">
                            Vyplňte uživatelské jméno.
                        </div>
                    </div>
                </div>
    
                <div class="input-group mb-3">
    
                    <span class="input-group-text">
                        <i class="fa-solid fa-key"></i>
                    </span>
    
                    <div class="form-floating">
                        <input type="password"
                               class="form-control"
                               id="password"
                               placeholder="Heslo"
                               required>
    
                        <label for="password">
                            Heslo
                        </label>
    
                        <div class="invalid-feedback">
                            Vyplňte heslo.
                        </div>
                    </div>
                </div>
    
                <div class="input-group mb-4">
    
                    <span class="input-group-text">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </span>
    
                    <div class="form-floating">
                        <select class="form-select"
                                required>
    
                            <option value="" selected disabled>
                                Vyberte si...
                            </option>
    
                            <option value="it">
                                Informační technologie
                            </option>
    
                            <option value="vos">
                                Vyšší odborná škola
                            </option>
    
                            <option value="jaz">
                                Jazyková škola
                            </option>
    
                            <option value="eko">
                                Ekonomie
                            </option>

                            <option value="liba">
                                Libor
                            </option>
    
                        </select>
    
                        <label for="obor">
                            Studijní obor
                        </label>
    
                        <div class="invalid-feedback">
                            Vyberte jednu možnost.
                        </div>
                    </div>
                </div>
                <div class="form-floating">
                    <input type="text" class="form-control" placeholder="a" id="class" name="class" required>
                    <label for="class">vlož třídu</label>
                </div>
                <button class="btn btn-primary w-100 btn-login"
                        type="submit">
                    Přihlásit se
                </button>
                
            </form>
    
        </div>
    </div>

    
</body>
</html>
