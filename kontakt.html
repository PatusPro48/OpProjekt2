<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/fontawesome.min.css">
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .navbar {
            background-color: rgb(63, 43, 177) padding: 15px;
        }

        .navbar-brand {
            color: rgb(63, 43, 177);
            font-size: 24px;
            text-decoration: none;
        }

        .navbar-nav {
            display: flex;
            gap: 10px;
        }

        .nav-link {
            color: rgb(63, 43, 177);
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-link:hover {
            background-color: #0d6efd;
            color: white;
        }


        .navbar-brand:hover {
            color: #0d6efd;
        }

        .footer {
            background-color: #0f2338;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-sm bg-transparent">
        <ul class="nav-item">
            <a class="nav-link" href="index.html">domovská stránka</a>
        </ul>
        <ul class="nav-item">
            <a class="nav-link" href="multipleselect.html">multipleselect</a>
        </ul>
        <ul class="nav-item">
            <a class="nav-link" href="kontakt.html">kontakt</a>
        </ul>
        <ul class="nav-item">
            <a class="nav-link" href="karty.html">karty</a>
        </ul>
        <ul class="nav-item">
            <a class="nav-link" href="page2.html">page2</a>
        </ul>
    </nav>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <h2 class="text-center mb-10">Kontakt</h2>

                <form>
                    <div class="mb-10">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email">
                    </div>
                    <p>
                    <div class="form-floating">
                        <select class="form-select" id="kra" name="kraj" required>
                            <option value="" selected disabled>vybrat</option>
                            <option value="Zk">Zlínský kraj</option>
                            <option value="MSK">Moravskoslezský kraj</option>
                            <option value="JMK">Jihomoravský kraj</option>
                            <option value="KV">kraj Vysočina</option>
                            <option value="OK">Olomoucký kraj</option>
                            <option value="PK">Pardubický kraj</option>
                            <option value="KHK">Královéhradecký kraj</option>
                            <option value="JCK">Jihočeský kraj</option>
                            <option value="PK">Plzeňský kraj</option>
                            <option value="LK">Liberecký kraj</option>
                            <option value="UK">Ústecký kraj</option>
                            <option value="KK">Karlovarský kraj</option>
                            <option value="SK">Středočeský kraj</option>
                            <option value="HMP">Hlavní město Praha</option>
                        </select>
                        <label for="kraj" class="form-label">Vyberte Kraj</label>
                    </div>
                    </p>
                    <div class="mb-10">
                        <label for="message" class="form-label">Zpráva</label>
                        <textarea class="form-control" id="message" name="message" rows="8"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Odeslat
                    </button>
                </form>

            </div>
        </div>
    </div>
</body>

</html>
