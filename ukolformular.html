<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="node_modules/bootswatch/dist/lux/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/tom-select/dist/css/tom-select.min.css">
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script src="node_modules/tom-select/dist/js/tom-select.base.min.js"></script>
    <script src="node_modules/tinymce/"></script>

    
    <style>
      .dropdown-submenu {
  position: relative;
}

.dropdown-submenu .dropdown-menu {
  top: 0;
  left: 100%;
  margin-top: -1px;
}
    </style>
</head>
<body>
    <div class="form-floating mb-3 mt-3 max-width="200"">
        <input type="text" class="form-control" id="name" placeholder="Enter name" name="nm" required>
        <label for="nm">jméno</label>
      </div>
      
      <div class="form-floating mt-3 mb-3">
        <input type="text" class="form-control" id="surname" placeholder="Enter surname" name="srnm" required>
        <label for="srnm">příjmení</label>
      </div>
      <div class="form-floating mt-3 mb-3">
        <input type="date" class="form-control" id="date" placeholder="Enter date" name="dt" required>
        <label for="dt">datum</label>
      </div>
      <p>
      <div class="form-floating">
        <select class="form-select" id="kra" name="kraj" required>
            <option value="" selected disabled>vybrat</option>
          <option value="Zk">Zlínský kraj</option>
          <option value="MSK">Moravskoslezský kraj</option>
          <option value="JMK">Jihomoravský kraj</option>
          <option value="KV">kraj Vysočina</option>
          <option value="OK">Olomoucký kraj</option>
          <option value="PK">Pardubický kraj</option>
          <option value="KHK">Královéhradecký kraj</option>
          <option value="JCK">Jihočeský kraj</option>
          <option value="PK">Plzeňský kraj</option>
          <option value="LK">Liberecký kraj</option>
          <option value="UK">Ústecký kraj</option>
          <option value="KK">Karlovarský kraj</option>
          <option value="SK">Středočeský kraj</option>
          <option value="HMP">Hlavní město Praha</option>
        </select>
        <label for="kraj" class="form-label">Vyberte Kraj</label>
      </div>
      </p>

      <div class="form-floating mb-3 mt-3 max-width="200"">
        <input type="file" class="form-control" id="foto" placeholder="file" name="fo" required>
        <label for="fo">vyberte soubor</label>
      </div>
      <select id="jazyk" name="language[]" multiple placeholder="vybrat jazykovou úroveň" autocomplete="off">
        <option value="">Select a state...</option>
        <option value="EA0">english A0</option>
        <option value="EA1">english A1</option>
        <option value="EA2">english A2</option>
        <option value="EB1">english B1</option>
        <option value="EB2">english B2</option>
        <option value="EC1">english C1</option>
        <option value="DA0">deutsch A0</option>
        <option value="DA1">deutsch A1</option>
        <option value="DA2">deutsch A2</option>
        <option value="DB1">deutsch B1</option>
        <option value="DB2">deutsch B2</option>
        <option value="DC1">deutsch C1</option>
      </select>
      <p>
      <div class="form-floating">
        <textarea class="form-control" id="comment" name="text" placeholder="Comment goes here"></textarea>
        <label for="comment">motivace k registraci</label>
      </div>
      </p>
    
</body>
</html>
